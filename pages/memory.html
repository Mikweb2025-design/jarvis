  <div id="mem-panel-header">
    <h3>◈ MEMORIA</h3><span id="mem-count-label">0 facts</span>
    <button id="mem-close" onclick="closeMem()">✕</button>
  </div>
  <div id="mem-search-wrap">
    <input id="mem-search" placeholder="FILTRA RICORDI..." oninput="filterMem(this.value)">
  </div>
  <div id="mem-list" style="flex:1;overflow-y:auto;padding:10px 0"></div>
  <div id="mem-add-wrap" style="padding:12px 16px;border-top:1px solid rgba(170,0,255,0.1);flex-shrink:0">
    <input id="mem-add-input" placeholder="Nuovo ricordo..." style="width:100%;background:rgba(18,18,26,0.9);border:1px solid rgba(170,0,255,0.2);color:var(--tx);font-size:11px;font-family:var(--fm);padding:7px 10px;outline:none;border-radius:3px;box-sizing:border-box;margin-bottom:6px">
    <button id="mem-add-btn" onclick="addMem()" style="width:100%;background:rgba(170,0,255,0.12);border:1px solid rgba(170,0,255,0.3);color:var(--pp);font-family:var(--fd);font-size:9px;letter-spacing:0.2em;padding:7px;cursor:pointer;border-radius:3px">+ SALVA RICORDO</button>
  </div>
<script>
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function closeMem(){ document.getElementById('mem-panel')?.classList.remove('open'); }
window.closeMem = closeMem;
function openMem(){ document.getElementById('mem-panel')?.classList.add('open'); memRefresh(); }
window.openMem = openMem;
function memRefresh(){
  var list = document.getElementById('mem-list');
  list.innerHTML = '<div style="text-align:center;color:var(--tx4);font-size:11px;padding:20px;font-family:var(--fm)">⏳ caricamento...</div>';
  fetchMem();
}
document.addEventListener('DOMContentLoaded', function(){
  var inp = document.getElementById('mem-add-input');
  if(inp) inp.addEventListener('keydown', function(e){ if(e.key==='Enter') addMem(); });
});
async function fetchMem(){
  try {
    var r = await fetch('/api/memory/all');
    var d = await r.json();
    var list = document.getElementById('mem-list');
    var label = document.getElementById('mem-count-label');
    if(!d.memories || d.memories.length===0){
      list.innerHTML = '<div style="text-align:center;color:var(--tx4);font-size:11px;font-family:var(--fm);padding:30px 20px;letter-spacing:0.1em">&#129504; Nessun ricordo salvato</div>';
      if(label) label.textContent = '0 facts';
      return;
    }
    if(label) label.textContent = d.memories.length+' facts';
    list.innerHTML = d.memories.map(function(m){ return renderMemItem(m); }).join('');
  } catch(e){
    document.getElementById('mem-list').innerHTML = '<div style="text-align:center;color:var(--pk);font-size:11px;padding:20px">⚠ Errore caricamento memoria</div>';
  }
}
function renderMemItem(m){
  var date = m.created_at ? new Date(m.created_at).toLocaleDateString('it',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
  return '<div class="mem-item" style="padding:10px 16px;border-bottom:1px solid rgba(170,0,255,0.06);display:flex;align-items:flex-start;gap:8px">'+
    '<div style="flex:1;min-width:0">'+
    '<div style="font-size:8px;font-family:var(--fm);letter-spacing:0.2em;color:var(--pp);margin-bottom:3px;text-transform:uppercase;opacity:0.7">'+esc(m.category||'fact')+'</div>'+
    '<div style="font-size:11px;color:var(--tx2);line-height:1.5;word-break:break-word">'+esc(m.content||'')+'</div>'+
    '<div style="font-size:8px;color:var(--tx4);margin-top:3px;font-family:var(--fm)">'+date+'</div>'+
    '</div>'+
    '<button onclick="deleteMem('+m.id+')" style="background:none;border:none;color:rgba(255,85,119,0.4);cursor:pointer;font-size:14px;padding:0 2px;line-height:1">✕</button>'+
    '</div>';
}
async function addMem(){
  var inp = document.getElementById('mem-add-input');
  var text = inp.value.trim();
  if(!text){ sysmsg('⚠ Inserisci un testo'); return; }
  try {
    var r = await fetch('/api/memory/remember', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:text,category:'fact',tags:[]})});
    var d = await r.json();
    sysmsg('✅ Ricordo salvato');
    inp.value = '';
    fetchMem();
  } catch(e){ sysmsg('⚠ Errore: '+e.message); }
}
async function deleteMem(id){
  try {
    await fetch('/api/memory/delete', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id})});
    fetchMem();
  } catch(e){ sysmsg('⚠ Errore: '+e.message); }
}
async function filterMem(q){
  if(!q){ fetchMem(); return; }
  try {
    var r = await fetch('/api/memory/search', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q})});
    var d = await r.json();
    var list = document.getElementById('mem-list');
    if(!d.results || d.results.length===0){
      list.innerHTML = '<div style="text-align:center;color:var(--tx4);font-size:11px;padding:20px">Nessun risultato per "'+esc(q)+'"</div>';
      return;
    }
    list.innerHTML = d.results.map(function(m){ return renderMemItem(m); }).join('');
  } catch(e){ document.getElementById('mem-list').innerHTML = '<div style="text-align:center;color:var(--pk);font-size:11px;padding:20px">⚠ Errore ricerca</div>'; }
}
</script>
