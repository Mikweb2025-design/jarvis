
<!DOCTYPE html>
<html><body style="background:#111;margin:0;overflow:hidden">
<canvas id="c" style="display:block;width:100vw;height:100vh"></canvas>
<script>
var c=document.getElementById('c'),ctx=c.getContext('2d');
function resize(){c.width=c.clientWidth;c.height=c.clientHeight}
window.onresize=resize;resize();
var mouthOpen=0;
setInterval(function(){mouthOpen=0.3+0.7*(0.5+0.5*Math.sin(Date.now()*0.003))},50);
(function loop(){
  ctx.clearRect(0,0,c.width,c.height);
  var cx=c.width/2,cy=c.height/2;
  var w=100*(0.5+mouthOpen),h=40*mouthOpen+10;
  ctx.fillStyle='red';
  ctx.shadowColor='red';ctx.shadowBlur=30;
  ctx.beginPath();ctx.ellipse(cx,cy,w,h,0,0,6.28);ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='#0ff';ctx.font='20px monospace';
  ctx.fillText('mouth:'+mouthOpen.toFixed(2),10,30);
  requestAnimationFrame(loop);
})();
</script>
</body></html>
